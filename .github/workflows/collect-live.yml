name: Collect live wait times

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay a few min)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/collect_live.py --once
        env:
          TZ: America/Los_Angeles
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "Live snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
